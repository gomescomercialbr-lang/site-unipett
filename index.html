<style>
  :root{
    --cream:#FAF3E6;
    --cream-2:#F3E8D8;
    --ink:#201F22;
    --ink-soft:#636267;
    --destaque:#FF75B0;
    --destaque-dark:#AD5078;
    --destaque-darker:#7F3B58;
    --principal:#01C1C2;
    --principal-dark:#017F80;
    --principal-darker:#016061;
    --radius:18px;
    --maxw:1180px;
    --shadow:0 10px 30px rgba(42,31,26,0.12);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:700;
    line-height:1.12;
    margin:0 0 .5em;
    color:var(--ink);
  }
  p{margin:0 0 1em;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;
    padding:15px 26px;border-radius:999px;border:none;cursor:pointer;
    min-height:52px;line-height:1;white-space:nowrap;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--principal-dark);color:#fff;box-shadow:0 8px 20px rgba(1,127,128,0.35);}
  .btn-primary:hover{background:var(--principal-darker);}
  .btn-secondary{background:#fff;color:var(--ink);border:2px solid var(--ink);}
  .btn-secondary:hover{background:var(--ink);color:#fff;}
  .btn-outline{background:transparent;color:var(--principal-dark);border:2px solid var(--principal-dark);}
  .btn-outline:hover{background:var(--principal-dark);color:#fff;}
  .btn-sm{padding:10px 18px;font-size:.9rem;min-height:44px;}

  /* Header */
  header.site-header{position:fixed;top:0;left:0;right:0;z-index:100;}
  .demo-banner{
    background:var(--principal-darker);color:#fff;text-align:center;
    font-size:.72rem;font-weight:600;padding:6px 12px;
  }
  .header-main{
    background:rgba(250,243,230,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(42,31,26,0.08);
  }
  .header-inner{
    max-width:var(--maxw);margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-icon{height:38px;width:38px;flex-shrink:0;}
  @media (min-width:768px){ .brand-icon{height:46px;width:46px;} }
  .brand-name{
    font-family:'Fraunces',serif;font-weight:700;color:var(--ink);
    font-size:clamp(1rem,3vw,1.35rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .header-emergency{
    font-weight:600;color:var(--ink-soft);white-space:nowrap;
    font-size:clamp(.66rem,2.6vw,.88rem);transition:color .15s ease;
  }
  .header-emergency:hover{color:var(--principal-dark);text-decoration:underline;}

  main{padding-top:92px;}
  section[id]{scroll-margin-top:100px;}

  /* Opening (video hero) */
  .opening{position:relative;}
  .opening-media{position:relative;width:100%;height:65vh;overflow:hidden;background:var(--cream-2);}
  .opening-media video,
  .opening-static-img{width:100%;height:100%;object-fit:cover;object-position:80% center;display:block;}
  .opening-static-img{display:none;}
  html.reduced-motion .opening-media video{display:none;}
  html.reduced-motion .opening-static-img{display:block;}
  .opening-gradient{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top, var(--cream) 0%, var(--cream) 18%, transparent 55%);
  }
  .opening-content{
    position:relative;background:var(--cream);padding:32px 24px 44px;text-align:center;
  }
  .opening-content h1{font-size:clamp(2.2rem,9vw,2.8rem);line-height:1.05;margin:0 0 .5em;text-wrap:balance;}
  .opening-sub{font-size:1.05rem;color:var(--ink-soft);max-width:42ch;margin:0 auto 1.3em;}
  .opening-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:22px;}
  .opening-actions .btn{width:100%;max-width:320px;}
  .opening-badges{
    list-style:none;margin:0 auto;padding:0;max-width:340px;
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
  }
  .opening-badge{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;
    padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:700;
    color:var(--ink);box-shadow:var(--shadow);
  }
  .opening-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--destaque);flex-shrink:0;}

  @media (min-width:821px){
    .opening{height:100vh;min-height:640px;display:flex;align-items:center;overflow:hidden;}
    .opening-media{position:absolute;inset:0;width:100%;height:100%;}
    .opening-media video,
    .opening-static-img{object-position:70% center;}
    .opening-gradient{
      background:linear-gradient(to right, var(--cream) 0%, var(--cream) 38%, transparent 62%);
    }
    .opening-content{
      position:relative;z-index:2;background:transparent;
      max-width:clamp(700px, 52vw, 800px);text-align:left;
      padding:0 24px 0 clamp(64px, 8vw, 160px);
    }
    .opening-content h1{font-size:clamp(2.8rem,5.2vw,5rem);line-height:1.05;}
    .opening-sub{margin:0 0 1.3em;}
    .opening-actions{justify-content:flex-start;}
    .opening-actions .btn{width:auto;max-width:none;}
    .opening-badges{
      display:flex;flex-wrap:nowrap;justify-content:flex-start;max-width:none;margin:0;
    }
  }

  /* Services grid */
  .section{padding:70px 0;}
  .section-title{text-align:center;max-width:640px;margin:0 auto 42px;}
  .section-title h2{font-size:clamp(1.7rem,4vw,2.4rem);text-wrap:balance;}
  .section-title p{color:var(--ink-soft);font-size:1.05rem;}

  .grid{
    display:grid;gap:22px;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  }
  .card{
    background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;
  }
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;}
  .card-body{padding:20px 22px 24px;}
  .card-body h3{font-size:1.2rem;margin-bottom:.35em;}
  .card-body p{color:var(--ink-soft);font-size:.96rem;margin:0;}
  .card-icon{
    width:52px;height:52px;border-radius:50%;background:var(--destaque);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    margin:24px 0 0 24px;color:var(--ink);
  }
  .card-icon svg{width:26px;height:26px;}
  .card-icon.cor-principal{background:var(--principal);}
  .card-text .card-body{padding:14px 24px 26px;}

  /* Estrutura (fundo com imagem de fechamento) */
  .estrutura-section{position:relative;overflow:hidden;padding:64px 0 40px;}
  .estrutura-bg{position:absolute;inset:0;z-index:0;}
  .estrutura-bg img{width:100%;height:100%;object-fit:cover;display:block;}
  .estrutura-bg::after{content:"";position:absolute;inset:0;background:var(--cream);opacity:.8;}
  @media (max-width:820px){ .estrutura-bg::after{opacity:.88;} }
  .estrutura-section .wrap{position:relative;z-index:1;}
  .card.card-text{
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .estrutura-grid{grid-template-columns:1fr;}
  @media (min-width:600px){ .estrutura-grid{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:1000px){ .estrutura-grid{grid-template-columns:repeat(4,1fr);} }
  .estrutura-cta{text-align:center;margin-top:36px;}

  @media (min-width:701px){
    .petshop-grid-5{grid-template-columns:repeat(6,1fr);}
    .petshop-grid-5 .card:nth-child(1),
    .petshop-grid-5 .card:nth-child(2),
    .petshop-grid-5 .card:nth-child(3){grid-column:span 2;}
    .petshop-grid-5 .card:nth-child(4){grid-column:2 / span 2;}
    .petshop-grid-5 .card:nth-child(5){grid-column:4 / span 2;}
  }
  #petshop .card-body p{color:var(--ink);font-size:1.02rem;}

  /* Contato / como chegar */
  .contact-section{background:var(--cream-2);}
  .contact-buttons{display:flex;flex-direction:column;gap:14px;max-width:360px;margin:0 auto;}
  @media (min-width:700px){
    .contact-buttons{
      flex-direction:row;justify-content:center;align-items:stretch;max-width:none;
    }
    .contact-buttons .btn{flex:1 1 0;max-width:300px;}
  }
  .contact-note{text-align:center;color:var(--ink-soft);font-size:.95rem;margin:24px 0 0;}

  /* Footer */
  footer{background:var(--ink);color:var(--cream);padding:50px 0 30px;}
  .footer-inner{display:grid;gap:28px;grid-template-columns:1fr;}
  @media (min-width:700px){ .footer-inner{grid-template-columns:1.3fr 1fr 1fr;} }
  .footer-brand{display:flex;align-items:center;gap:10px;}
  .footer-brand .brand-icon{height:40px;width:40px;}
  .footer-brand .brand-name{color:var(--cream);}
  footer h4{font-family:'Inter',sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--destaque);margin:0 0 10px;}
  footer p, footer a{color:rgba(250,243,230,0.85);font-size:.95rem;}
  footer a:hover{color:#fff;text-decoration:underline;}
  footer a.icon-link{display:inline-flex;align-items:center;gap:7px;}
  footer a.icon-link svg{width:15px;height:15px;flex-shrink:0;}
  .footer-bottom{
    margin-top:36px;padding-top:20px;border-top:1px solid rgba(250,243,230,0.15);
    font-size:.82rem;color:rgba(250,243,230,0.6);text-align:center;
  }

  /* Floating WhatsApp */
  .float-wa-wrap{
    position:fixed;right:18px;bottom:18px;z-index:200;
    display:flex;align-items:center;gap:10px;
    opacity:0;visibility:hidden;transform:translateY(12px);
    transition:opacity .35s ease, transform .35s ease, visibility .35s;
  }
  .float-wa-wrap.is-visible{opacity:1;visibility:visible;transform:translateY(0);}
  .float-wa{
    width:60px;height:60px;border-radius:50%;background:var(--principal-dark);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 10px 24px rgba(1,127,128,0.45);
  }
  .float-wa svg{width:30px;height:30px;}
  .float-wa:hover{background:var(--principal-darker);}
  .float-balloon{
    position:relative;background:#fff;color:var(--ink);
    padding:10px 30px 10px 14px;border-radius:12px;box-shadow:var(--shadow);
    font-size:.85rem;font-weight:600;white-space:nowrap;
    opacity:0;transform:translateX(8px) scale(.96);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
  }
  .float-balloon.is-shown{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;}
  .float-balloon-close{
    position:absolute;top:2px;right:4px;background:none;border:none;cursor:pointer;
    font-size:1rem;line-height:1;color:var(--ink-soft);padding:4px;
  }
  .float-balloon-close:hover{color:var(--ink);}
</style>
</head>

      <div class="contact-buttons">

      </div>
      <p class="contact-note" id="contato-horario"></p>
    </div>
  </section>

</main>

  <a class="float-wa" id="float-wa-btn" aria-label="Chamar no WhatsApp" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.63 1.44 5.15L2 22l5.1-1.53a9.8 9.8 0 0 0 4.94 1.33h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.08c-.24.68-1.4 1.3-1.95 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.3-1.64-.59-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.17.01.41-.07.64.49.24.58.81 1.99.88 2.13.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.29-.12.57.17.29.76 1.26 1.63 2.04 1.12 1 2.07 1.31 2.36 1.46.29.14.46.12.63-.07.17-.19.73-.85.93-1.14.19-.29.38-.24.64-.14.26.1 1.65.78 1.93.92.29.14.48.21.55.33.07.12.07.69-.17 1.37z"/>
    </svg>
  </a>
</div>

<script src="/config.js"></script>
<script>
(function(){
  "use strict";

  var ICONS = {
    pulso: '<polyline points="2 12 6 12 9 3 15 21 18 12 22 12"/>',
    virus: '<circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><line x1="12" y1="3.8" x2="12" y2="6.2"/><line x1="12" y1="17.8" x2="12" y2="20.2"/><line x1="3.8" y1="12" x2="6.2" y2="12"/><line x1="17.8" y1="12" x2="20.2" y2="12"/><line x1="6.3" y1="6.3" x2="7.9" y2="7.9"/><line x1="16.1" y1="16.1" x2="17.7" y2="17.7"/><line x1="17.7" y1="6.3" x2="16.1" y2="7.9"/><line x1="7.9" y1="16.1" x2="6.3" y2="17.7"/>',
    gota: '<path d="M12 3c3.3 4.7 6.2 8.4 6.2 11.7A6.2 6.2 0 1 1 5.8 14.7C5.8 11.4 8.7 7.7 12 3z"/>',
    seringa: '<line x1="19.5" y1="2.5" x2="22" y2="5"/><line x1="17" y1="5" x2="20" y2="8"/><rect x="9.5" y="9.5" width="8.5" height="5.5" rx="1" transform="rotate(45 13.75 12.25)"/><line x1="14" y1="8" x2="16" y2="10"/><line x1="11" y1="11" x2="13" y2="13"/><line x1="9" y1="15" x2="4" y2="20"/><line x1="4" y1="18" x2="6" y2="20"/><line x1="2" y1="20" x2="4" y2="22"/>',
    internacao: '<path d="M3 18v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5"/><path d="M3 18h18"/><path d="M5 11V8a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3"/><circle cx="7.5" cy="8.5" r="1"/>'
  };

  var ICON_ORDER = ["emergencia24h", "internacao", "doencasVirais", "bancoSangue", "vacinacao"];
  var FOTO_ORDER = ["banhoTosa", "brinquedos", "racao", "caminhas", "acessorios"];

  function clampText(s, max){
    s = (s == null ? "" : String(s)).trim();
    if (s.length > max) s = s.slice(0, max);
    return s;
  }

  function getParam(name){
    try {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    } catch (e) { return null; }
  }

  function isPlainObject(v){
    return v && typeof v === "object" && !Array.isArray(v);
  }

  function deepMerge(base, override){
    var out = {};
    var k;
    for (k in base) out[k] = base[k];
    if (override) {
      for (k in override) {
        if (isPlainObject(override[k]) && isPlainObject(base[k])) {
          out[k] = deepMerge(base[k], override[k]);
        } else {
          out[k] = override[k];
        }
      }
    }
    return out;
  }

  function buildEffectiveConfig(){
    var cfg = deepMerge(CONFIG, {});

    var tipoParam = getParam("tipo");
    if (tipoParam === "hospital" || tipoParam === "petshop") {
      cfg.tipo = tipoParam;
    }
    if (CONFIG_OVERRIDES_POR_TIPO[cfg.tipo]) {
      cfg = deepMerge(cfg, CONFIG_OVERRIDES_POR_TIPO[cfg.tipo]);
    }

    var clinica = getParam("clinica");
    if (clinica) cfg.nome = clampText(clinica, 40) || cfg.nome;

    var cidade = getParam("cidade");
    if (cidade) {
      cfg.endereco = deepMerge(cfg.endereco, { cidade: clampText(cidade, 40) || cfg.endereco.cidade });
    }

    var cor = getParam("cor");
    if (cor && PALETTES[cor]) cfg.corPaleta = cor;

    return cfg;
  }

  function fillTokens(str, cfg){
    return String(str || "")
      .split("{nome}").join(cfg.nome)
      .split("{cidade}").join(cfg.endereco.cidade);
  }

  function setText(id, text){
    var node = document.getElementById(id);
    if (node) node.textContent = text;
  }

  function waLink(numeroDigits, mensagem){
    return "https://wa.me/" + numeroDigits + "?text=" + encodeURIComponent(mensagem);
  }

  function buildCard(opts){
    // opts: {cor, iconSvg, imgSrc, imgAlt, titulo, descricao}
    var card = document.createElement("article");
    if (opts.imgSrc) {
      card.className = "card";
      var img = document.createElement("img");
      img.src = opts.imgSrc;
      img.alt = opts.imgAlt || "";
      img.width = 800; img.height = 598; img.loading = "lazy";
      card.appendChild(img);
    } else {
      card.className = "card card-text";
      var iconWrap = document.createElement("div");
      iconWrap.className = "card-icon" + (opts.cor === "principal" ? " cor-principal" : "");
      iconWrap.setAttribute("aria-hidden", "true");
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.innerHTML = opts.iconSvg || "";
      iconWrap.appendChild(svg);
      card.appendChild(iconWrap);
    }
    var body = document.createElement("div");
    body.className = "card-body";
    var h3 = document.createElement("h3");
    h3.textContent = opts.titulo;
    var p = document.createElement("p");
    p.textContent = opts.descricao;
    body.appendChild(h3);
    body.appendChild(p);
    card.appendChild(body);
    return card;
  }

  function render(cfg){
    var pal = PALETTES[cfg.corPaleta] || PALETTES.verde;
    var tipo = cfg.tipo === "petshop" ? "petshop" : "hospital";

    // ---- cores ----
    var rootStyle = document.documentElement.style;
    rootStyle.setProperty("--principal", pal.principal);
    rootStyle.setProperty("--principal-dark", pal.principalDark);
    rootStyle.setProperty("--principal-darker", pal.principalDarker);
    rootStyle.setProperty("--destaque", pal.destaque);
    rootStyle.setProperty("--destaque-dark", pal.destaqueDark);
    rootStyle.setProperty("--destaque-darker", pal.destaqueDarker);

    // ---- faixa demo + topo ----
    setText("demo-banner", cfg.faixaDemo);
    setText("brand-name", cfg.nome);
    var headerEmergency = document.getElementById("header-emergency");
    if (headerEmergency) {
      headerEmergency.textContent = "Emergência: " + cfg.telefone;
      headerEmergency.href = cfg.telefoneLink;
    }

    // ---- título da aba / meta / JSON-LD ----
    var tipoLabel = tipo === "petshop" ? "Petshop e banho e tosa" : "Hospital Veterinário";
    document.title = cfg.nome + " | " + tipoLabel + " em " + cfg.endereco.cidade;
    var metaDesc = document.querySelector('meta[name="description"]');
    var descTxt = fillTokens(cfg.abertura[tipo].subtitulo, cfg);
    if (metaDesc) metaDesc.setAttribute("content", descTxt);
    var ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute("content", cfg.nome + " | " + tipoLabel);
    var ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute("content", descTxt);

    var jsonldEl = document.getElementById("jsonld");
    if (jsonldEl) {
      var enderecoLinha = cfg.endereco.rua;
      var jsonld = {
        "@context": "https://schema.org",
        "@type": tipo === "petshop" ? "PetStore" : "VeterinaryCare",
        "name": cfg.nome,
        "description": descTxt,
        "telephone": cfg.telefoneLink.replace("tel:", ""),
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": enderecoLinha,
          "addressLocality": cfg.endereco.cidade,
          "addressRegion": cfg.endereco.estado,
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        }],
        "sameAs": [cfg.instagramLink]
      };
      jsonldEl.textContent = JSON.stringify(jsonld);
    }

    // ---- abertura ----
    var abertura = cfg.abertura[tipo];
    var mensagem = fillTokens(abertura.mensagemWhatsapp, cfg);
    var link = waLink(cfg.whatsapp, mensagem);

    var video = document.getElementById("opening-video");
    if (video) video.setAttribute("poster", cfg.video.poster);
    var srcDesktop = document.getElementById("opening-source-desktop");
    if (srcDesktop) srcDesktop.src = cfg.video.desktop;
    var srcMobile = document.getElementById("opening-source-mobile");
    if (srcMobile) srcMobile.src = cfg.video.mobile;
    if (video) video.load();
    var staticImg = document.getElementById("opening-static-img");
    if (staticImg) { staticImg.src = cfg.video.poster; staticImg.alt = cfg.video.alt; }

    setText("opening-title", fillTokens(abertura.titulo, cfg));
    setText("opening-sub", fillTokens(abertura.subtitulo, cfg));
    var ctaBtn = document.getElementById("opening-cta");
    if (ctaBtn) { ctaBtn.textContent = abertura.botaoPrincipal; ctaBtn.href = link; }

    var badgesEl = document.getElementById("opening-badges");
    if (badgesEl) {
      badgesEl.innerHTML = "";
      (cfg.selos[tipo] || []).forEach(function (texto) {
        var li = document.createElement("li");
        li.className = "opening-badge";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("aria-hidden", "true");
        li.appendChild(dot);
        li.appendChild(document.createTextNode(texto));
        badgesEl.appendChild(li);
      });
    }

    // ---- estrutura ----
    setText("estrutura-title", fillTokens(cfg.estrutura[tipo].titulo, cfg));
    setText("estrutura-sub", fillTokens(cfg.estrutura[tipo].subtitulo, cfg));
    var estruturaBgImg = document.getElementById("estrutura-bg-img");
    if (estruturaBgImg) { estruturaBgImg.src = cfg.imagemFechamento.src; estruturaBgImg.alt = ""; }

    var estruturaGrid = document.getElementById("estrutura-grid");
    var estruturaSection = document.getElementById("estrutura");
    if (estruturaGrid) {
      estruturaGrid.innerHTML = "";
      var visibleIcon = 0;
      ICON_ORDER.forEach(function (id) {
        if (!cfg.servicos[id]) return;
        var item = CATALOGO_SERVICOS[id];
        if (!item) return;
        visibleIcon++;
        estruturaGrid.appendChild(buildCard({
          cor: item.cor,
          iconSvg: ICONS[item.icone],
          titulo: item.titulo,
          descricao: item.descricao
        }));
      });
      if (estruturaSection) estruturaSection.style.display = visibleIcon ? "" : "none";
    }
    var estruturaCta = document.getElementById("estrutura-cta-btn");
    if (estruturaCta) { estruturaCta.textContent = abertura.botaoPrincipal; estruturaCta.href = link; }

    // ---- petshop ----
    var petshopSection = document.getElementById("petshop");
    if (petshopSection) {
      if (!cfg.servicos.petshop) {
        petshopSection.style.display = "none";
      } else {
        petshopSection.style.display = "";
        setText("petshop-title", fillTokens(cfg.petshopSecao[tipo].titulo, cfg));
        setText("petshop-sub", fillTokens(cfg.petshopSecao[tipo].subtitulo, cfg));
        var petshopGrid = document.getElementById("petshop-grid");
        petshopGrid.innerHTML = "";
        petshopGrid.classList.remove("petshop-grid-5");
        var visibleFoto = 0;
        FOTO_ORDER.forEach(function (id) {
          if (!cfg.servicos[id]) return;
          var item = CATALOGO_SERVICOS[id];
          if (!item) return;
          visibleFoto++;
          petshopGrid.appendChild(buildCard({
            imgSrc: item.imagem,
            imgAlt: item.alt,
            titulo: item.titulo,
            descricao: item.descricao
          }));
        });
        if (visibleFoto === 5) petshopGrid.classList.add("petshop-grid-5");
        if (visibleFoto === 0) petshopSection.style.display = "none";
      }
    }

    // ---- contato ----
    setText("contato-title", fillTokens(cfg.contatoTitulo, cfg));
    var mapaBtn = document.getElementById("contato-mapa");
    if (mapaBtn) mapaBtn.href = cfg.mapsLink;
    var waBtn = document.getElementById("contato-whatsapp");
    if (waBtn) { waBtn.textContent = abertura.botaoPrincipal; waBtn.href = link; }
    var reviewBtn = document.getElementById("google-review-btn");
    if (reviewBtn) {
      reviewBtn.href = cfg.avaliacoesLink;
      reviewBtn.textContent = (cfg.notaGoogle && cfg.totalAvaliacoes)
        ? "Ver avaliações no Google · " + cfg.notaGoogle + " ★ (" + cfg.totalAvaliacoes + ")"
        : "Ver avaliações no Google";
    }
    setText("contato-horario", cfg.horario + ".");

    // ---- rodapé ----
    setText("footer-brand-name", cfg.nome);
    setText("footer-slogan", cfg.slogan);
    var footerTel = document.getElementById("footer-telefone");
    if (footerTel) { footerTel.textContent = cfg.telefone; footerTel.href = cfg.telefoneLink; }
    var footerWa = document.getElementById("footer-whatsapp");
    if (footerWa) footerWa.href = waLink(cfg.whatsapp, mensagem);
    var footerInsta = document.getElementById("footer-instagram");
    if (footerInsta) footerInsta.href = cfg.instagramLink;
    setText("footer-instagram-text", cfg.instagram);

    var enderecoTexto = cfg.endereco.rua + " – " + cfg.endereco.bairro +
      "\n" + cfg.endereco.cidade + "/" + cfg.endereco.estado +
      (cfg.endereco.cep ? ", CEP " + cfg.endereco.cep : "");
    var footerEndereco = document.getElementById("footer-endereco");
    if (footerEndereco) {
      footerEndereco.innerHTML = "";
      enderecoTexto.split("\n").forEach(function (linha, i) {
        if (i > 0) footerEndereco.appendChild(document.createElement("br"));
        footerEndereco.appendChild(document.createTextNode(linha));
      });
    }
    setText("footer-horario", cfg.horario);
    setText("footer-copyright", "© " + new Date().getFullYear() + " " + cfg.nome + ". Todos os direitos reservados.");

    // ---- botão flutuante ----
    var floatBtn = document.getElementById("float-wa-btn");
    if (floatBtn) floatBtn.href = waLink(cfg.whatsapp, mensagem);
    setText("float-balloon-text", cfg.balaoFlutuante[tipo]);
  }

  var cfg = buildEffectiveConfig();
  render(cfg);

  /* ---------- Reduced motion ---------- */
  var prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (prefersReduced) {
    document.documentElement.classList.add("reduced-motion");
  }

  /* ---------- Botão flutuante do WhatsApp ---------- */
  var floatWrap = document.getElementById("float-wa-wrap");
  var balloon = document.getElementById("float-balloon");
  var balloonClose = document.getElementById("float-balloon-close");
  var openingEl = document.getElementById("opening");

  if (floatWrap && openingEl) {
    var shown = false;
    var balloonShown = false;
    var balloonDismissed = false;
    var isMobileView = window.matchMedia("(max-width: 820px)").matches;

    var maybeShowBalloon = function () {
      if (balloonShown || balloonDismissed || !balloon) return;
      balloonShown = true;
      balloon.classList.add("is-shown");
      if (isMobileView) {
        setTimeout(function () { balloon.classList.remove("is-shown"); }, 6000);
      }
    };

    var checkFloatVisibility = function () {
      var threshold = openingEl.getBoundingClientRect().bottom;
      var shouldShow = threshold <= 0;
      if (shouldShow && !shown) {
        shown = true;
        floatWrap.classList.add("is-visible");
        setTimeout(maybeShowBalloon, 500);
      } else if (!shouldShow && shown) {
        shown = false;
        floatWrap.classList.remove("is-visible");
      }
    };

    window.addEventListener("scroll", checkFloatVisibility, { passive: true });
    checkFloatVisibility();

    if (balloonClose) {
      balloonClose.addEventListener("click", function () {
        balloonDismissed = true;
        balloon.classList.remove("is-shown");
      });
    }
  }
})();
</script>
